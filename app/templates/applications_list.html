<!-- templates/employer/applications_list.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Applications</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <h1>Job Applications</h1>

    {% if applications %}
        <table border="1" cellpadding="8">
            <thead>
                <tr>
                    <th>Job Title</th>
                    <th>Applicant Name</th>
                </tr>
            </thead>
            <tbody>
                {% for app in applications %}
                    <tr>
                        <td>{{ app.job.title }}</td>
                        <td>{{ app.jobseeker.username }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No applications found.</p>
    {% endif %}

    <p><a href="{{ url_for('employer.dashboard') }}">Back to Dashboard</a></p>
</body>
</html>
